# NGINX site config for reversing proxying dozencrust.com to local trader API
# Copy this file to /etc/nginx/sites-available/trader and enable it with a symlink

# 1) Redirect plain HTTP to HTTPS (keep ACME challenge accessible)
server {
    listen 80;
    server_name dozencrust.com www.dozencrust.com;

    # Allow ACME challenge through for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS server (requires certificates for dozencrust.com)
server {
    listen 443 ssl http2;
    server_name dozencrust.com www.dozencrust.com;

    # Paths to TLS certificate (let's encrypt will populate these)
    ssl_certificate /etc/letsencrypt/live/dozencrust.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dozencrust.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256";

    # Security headers (adjust as needed)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy settings to local aiohttp server
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket compatibility
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts and buffering
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Optional: expose ACME challenge location for certbot (also handled above)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Optional: custom logging
    access_log /var/log/nginx/trader.access.log;
    error_log /var/log/nginx/trader.error.log warn;
}
